name: dart_slack

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/dart_slack.yaml"
      - "bin/**"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dart_slack.yaml"
      - "bin/**"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: "3.10.0"

      - name: 📦 Install Dependencies
        run: dart pub get

      - name: 🧹 Check Formatting
        run: dart format --set-exit-if-changed .

      - name: 🔎 Analyze
        run: dart analyze

      - name: 🧪 Run Tests
        run: dart test

  verify-version:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: "3.10.0"

      - name: 📦 Install Dependencies
        run: dart pub get

      - name: 🔎 Verify version
        run: dart run test --run-skipped -t version-verify
