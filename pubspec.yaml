name: dart_slack
description: A CLI for reading and writing messages, browsing channels, and looking up users in Slack.
version: 0.2.0
repository: https://github.com/WAMF/slack_cli
topics:
  - slack
  - cli
  - api

environment:
  sdk: ^3.13.0

dependencies:
  args: ^2.7.0
  characters: ^1.4.1
  cli_completion: ">=0.5.1 <0.7.0"
  http: ^1.3.0
  mason_logger: ^0.3.3
  meta: ^1.16.0
  web_socket_channel: ^3.0.2

dev_dependencies:
  # analyzer 14.5.0 removed a setter that build_runner 2.16.1 still uses, so
  # the version-verify build does not compile. Remove this cap when a
  # build_runner release supports analyzer 14.5.
  analyzer: ">=13.3.0 <15.0.0"
  build_runner: ^2.10.5
  build_verify: ^3.1.1
  build_version: ^2.1.3
  mocktail: ^1.0.4
  test: ^1.29.0
  very_good_analysis: ^11.0.0

executables:
  dart_slack:
